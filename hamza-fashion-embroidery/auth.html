<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Hamza Fashion Embroidery</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./auth.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header>
    <div class="brand">Hamza Fashion Embroidery</div>
    <nav class="categories">
      <a href="./index.html">Home</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card" id="loginCard">
      <h2>Login</h2>
      <form id="loginForm">
        <div>
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div>
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
        <p>No account? <a href="#" id="showRegister">Register here</a></p>
      </form>
    </section>

    <section class="auth-card" id="registerCard" style="display:none;">
      <h2>Register</h2>
      <form id="registerForm">
        <div>
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" required />
        </div>
        <div>
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" required />
        </div>
        <button type="submit" class="btn-primary">Register</button>
        <p>Already have an account? <a href="#" id="showLogin">Login here</a></p>
      </form>
    </section>
  </main>

  <script src="./js/auth.js" type="module"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
