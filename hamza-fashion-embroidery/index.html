<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamza Fashion Embroidery</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header>
    <div class="brand">Hamza Fashion Embroidery</div>
    <nav class="categories">
      <a href="#" data-cat="new">New Arrivals</a>
      <a href="#" data-cat="unstitched">Unstitched</a>
      <a href="#" data-cat="kurtas">Kurtas</a>
      <a href="#" data-cat="luxury">Luxury Embroidery</a>
    </nav>
    <div class="search">
      <input type="text" id="searchInput" placeholder="Search products..." />
    </div>
    <div class="utils">
        <button id="profileBtn" title="Profile"><i data-lucide="user"></i></button>
        <button id="wishlistBtn" title="Wishlist"><i data-lucide="heart"></i></button>
        <button id="cartBtn" title="Cart"><i data-lucide="shopping-cart"></i></button>
        <button id="loginBtn" title="Login">Login</button>
        <button id="registerBtn" title="Register">Register</button>
        <button id="avatarBtn" title="User" style="display:none;"><img src="./assets/avatar_placeholder.png" alt="User" width="32" height="32" style="border-radius:50%;"/></button>
      </div>
  </header>

  <section id="productGrid"></section>

  <section id="suggestions">
    <h2>Suggestions For You</h2>
    <div id="suggestionGrid" class="grid"></div>
  </section>

  <button id="backToTop" title="Back to top">↑</button>

  <footer>© 2026 Hamza Fashion Embroidery. All rights reserved.</footer>

  <script src="./js/script.js" type="module"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
