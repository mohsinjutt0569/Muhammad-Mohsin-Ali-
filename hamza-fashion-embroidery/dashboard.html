<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Hamza Fashion Embroidery</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header>
    <div class="brand">Hamza Fashion Embroidery – Dashboard</div>
    <nav class="categories">
      <a href="./index.html">Home</a>
      <button id="logoutBtn" title="Logout"><i data-lucide="log-out"></i></button>
    </nav>
  </header>

  <main class="admin-panel">
    <section class="product-form">
      <h2>Add / Edit Article</h2>
      <form id="articleForm">
        <input type="hidden" id="articleId" />
        <div>
          <label for="title">Title</label>
          <input type="text" id="title" required />
        </div>
        <div>
          <label for="body">Body (Markdown)</label>
          <textarea id="body" rows="6" required></textarea>
        </div>
        <div>
          <label for="img">Image URL (optional)</label>
          <input type="url" id="img" />
        </div>
        <div>
          <label for="tags">Tags (comma separated)</label>
          <input type="text" id="tags" />
        </div>
        <button type="submit" class="btn-primary">Save</button>
        <button type="reset" id="cancelEdit" class="btn-secondary" style="display:none;">Cancel</button>
      </form>
    </section>

    <section class="product-list">
      <h2>Your Articles</h2>
      <table id="articleTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Image</th>
            <th>Title</th>
            <th>Tags</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="./js/articles.js" type="module"></script>
  <script src="./js/auth.js" type="module"></script>
  <script>
    // Logout button handler
    document.getElementById('logoutBtn').addEventListener('click', () => {
      logout();
    });
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
